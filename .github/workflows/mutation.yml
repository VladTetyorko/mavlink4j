name: mutation
# Informational only: the score is reported, never gates a merge.
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  pit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Install socat (serial pty tests)
        run: sudo apt-get update && sudo apt-get install -y socat
      - name: PIT on codec and service
        run: ./mvnw -B -pl core -Ppit verify
      - name: Score in the job summary
        if: always()
        run: |
          report=core/target/pit-reports/mutations.xml
          if [ ! -f "$report" ]; then
            echo "No PIT report was produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - "$report" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          mutations = ET.parse(sys.argv[1]).getroot().findall("mutation")
          total = len(mutations)
          killed = sum(1 for m in mutations if m.get("status") == "KILLED")
          survived = sum(1 for m in mutations if m.get("status") == "SURVIVED")
          score = 100.0 * killed / total if total else 0.0
          print("## Mutation score (codec, service)")
          print()
          print("| Mutations | Killed | Survived | Score |")
          print("|---|---|---|---|")
          print(f"| {total} | {killed} | {survived} | {score:.1f}% |")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pit-report
          path: core/target/pit-reports
