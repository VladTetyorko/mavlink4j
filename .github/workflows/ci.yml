name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: verify (${{ matrix.os }}, JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, java: 17 }
          - { os: ubuntu-latest, java: 21 }
          - { os: windows-latest, java: 21 }
          - { os: macos-latest, java: 21 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Install socat (serial pty tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y socat
      - name: Verify
        run: ./mvnw -B verify

  sitl:
    name: sitl (ubuntu, JDK 21)
    runs-on: ubuntu-latest
    # Real ArduPilot firmware in Docker; allowed to be the slow job.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: docker/setup-buildx-action@v3
      - name: Build SITL image (layer-cached)
        uses: docker/build-push-action@v6
        with:
          context: sitl/docker
          load: true
          tags: mavlink4j-sitl:4.7.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: SITL smoke tests
        run: ./mvnw -B -Psitl -pl sitl -am verify
