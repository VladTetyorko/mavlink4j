name: release
on:
  # Actions, release, "Run workflow" on the `release` branch: picks the next version from the latest v* tag,
  # publishes, tags. Any other branch is refused.
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the last released version to bump
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Exact version (e.g. 1.2.0); overrides bump when set
        required: false
  # A hand-pushed tag releases exactly that version, but only if the tagged commit is on `release`.
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Allow releases only from the release branch
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [ "$GITHUB_REF" = refs/heads/release ] || {
              echo "::error::Run this workflow on the 'release' branch, not '$GITHUB_REF_NAME'."; exit 1; }
          else
            git fetch --no-tags origin release
            git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || {
              echo "::error::Tag $GITHUB_REF_NAME points at a commit that is not on the 'release' branch."; exit 1; }
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Resolve the release version
        env:
          BUMP: ${{ inputs.bump }}
          EXPLICIT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version="${GITHUB_REF_NAME#v}"
          elif [ -n "$EXPLICIT" ]; then
            version="${EXPLICIT#v}"
          else
            last=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1)
            if [ -z "$last" ]; then
              # First release: the pom's version without -SNAPSHOT (0.1.0-SNAPSHOT -> 0.1.0).
              version=$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout)
              version="${version%-SNAPSHOT}"
            else
              IFS=. read -r major minor patch <<< "${last#v}"
              patch="${patch%%[!0-9]*}"
              case "$BUMP" in
                major) version="$((major + 1)).0.0" ;;
                minor) version="${major}.$((minor + 1)).0" ;;
                *)     version="${major}.${minor}.$((patch + 1))" ;;
              esac
            fi
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "bad version: $version"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" != push ] && git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "tag v$version already exists"; exit 1
          fi
          echo "Releasing $version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Install socat (serial pty tests)
        run: sudo apt-get update && sudo apt-get install -y socat
      - name: Set the module versions
        run: ./mvnw -B versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
      - name: Sign and publish to Central Portal
        run: ./mvnw -B -Prelease deploy
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      # Tagged only after a successful deploy, so a failed run leaves no tag behind.
      - name: Tag the release
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"
      - name: Aggregate javadoc
        run: ./mvnw -B -pl core,serial,testkit javadoc:aggregate -DreportOutputDirectory=target/site -DdestDir=apidocs
      - name: Publish javadoc to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/site/apidocs
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "Release ${VERSION}" > release-notes.md
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          body_path: release-notes.md
